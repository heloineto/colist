version: 2

updates:
  - package-ecosystem: bun
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    cooldown:
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    assignees:
      - heloineto

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(ci)
    assignees:
      - heloineto

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    assignees:
      - heloineto
