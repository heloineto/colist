version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: semiannually
    open-pull-requests-limit: 10
    cooldown:
      semver-patch-days: 5
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      nestjs:
        applies-to: version-updates
        patterns:
          - '@nestjs/*'
        update-types:
          - major
          - minor
          - patch
      vitest:
        applies-to: version-updates
        patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - major
          - minor
          - patch
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Runtime is pinned to Node LTS (mise: node 24); don't chase new node majors
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    assignees:
      - heloineto

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: semiannually
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(ci)
    assignees:
      - heloineto

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: semiannually
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    assignees:
      - heloineto
