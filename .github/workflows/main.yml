name: Main

# Every merge to main: apply infra, build both images, roll the service.
# workflow_dispatch with api_image/web_image = rollback to existing images (no build).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_image:
        description: 'API image to roll back to: a tag (git-<sha>), a sha256:<digest>, or a full ECR ref.'
        required: true
        type: string
      web_image:
        description: 'Web image to roll back to: same forms as api_image.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: main-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  CLUSTER: colist-production
  SERVICE: colist-production
  FAMILY: colist-production

jobs:
  apply:
    name: Apply (production)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup toolchain
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true

      - name: Assume apply role
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/colist-tf-apply-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform -chdir=iac/environments/production init -input=false

      - name: Apply
        run: terraform -chdir=iac/environments/production apply -input=false -auto-approve

  build:
    name: Build & push ${{ matrix.app }} (arm64)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Read bun version
        id: versions
        run: echo "bun=$(jq -r '.packageManager | split("@")[1]' package.json)" >> "$GITHUB_OUTPUT"

      - name: Assume ECR push role
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/colist-ecr-push
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build & push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/colist-${{ matrix.app }}:git-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          build-args: |
            BUN_VERSION=${{ steps.versions.outputs.bun }}
            APP_VERSION=${{ github.sha }}

  deploy:
    name: Deploy
    needs: [apply, build]
    # Rollback dispatches skip apply and build; only a failed job blocks the deploy.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Assume apply role
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/colist-tf-apply-production
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve images to digests
        id: images
        env:
          API_INPUT: ${{ inputs.api_image || format('git-{0}', github.sha) }}
          WEB_INPUT: ${{ inputs.web_image || format('git-{0}', github.sha) }}
        run: |
          # resolve <repo> <ref>: ref is a tag (default: the immutable git-<sha> just pushed),
          # a sha256:<digest>, or a full ECR ref. Tags are pinned to their digest.
          resolve() {
            local repo_uri digest
            repo_uri=$(aws ecr describe-repositories --repository-names "$1" --query 'repositories[0].repositoryUri' --output text)
            case "$2" in
              */*)      echo "$2" ;;
              sha256:*) echo "$repo_uri@$2" ;;
              *)
                digest=$(aws ecr describe-images --repository-name "$1" --image-ids imageTag="$2" --query 'imageDetails[0].imageDigest' --output text)
                [[ "$digest" == sha256:* ]] || { echo "::error::no image $1:$2" >&2; exit 1; }
                echo "$repo_uri@$digest" ;;
            esac
          }
          echo "api=$(resolve colist-api "$API_INPUT")" >> "$GITHUB_OUTPUT"
          echo "web=$(resolve colist-web "$WEB_INPUT")" >> "$GITHUB_OUTPUT"

      - name: Roll service onto the resolved images
        run: bash .github/scripts/deploy-ecs.sh "$CLUSTER" "$SERVICE" "$FAMILY" "${{ steps.images.outputs.api }}" "${{ steps.images.outputs.web }}"
