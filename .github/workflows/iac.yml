name: IaC

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'iac/**'
      - '.github/workflows/iac.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  STACK: iac/environments/production

jobs:
  plan:
    name: Plan (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup toolchain
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          cache: true

      - name: Assume plan role
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/colist-tf-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform -chdir=$STACK init -input=false

      - name: Plan
        run: terraform -chdir=$STACK plan -input=false -lock=false
