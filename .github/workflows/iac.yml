name: IaC

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'iac/**'
      - '.github/workflows/iac.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: iac-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  STACK: iac/environments/production

jobs:
  plan:
    name: Plan (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup toolchain
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true

      - name: Assume plan role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/colist-tf-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform -chdir=$STACK init -input=false

      - name: Plan
        run: terraform -chdir=$STACK plan -input=false -lock=false
